<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow512" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#100820" flood-opacity="0.38"/>
    </filter>
    <!-- Spektralfarben des Lichts: Rot → Orange → Gelb → Grün → Cyan → Blau → Violett -->
    <linearGradient id="spectrumCover512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"    stop-color="#FF0000"/>
      <stop offset="16.6%" stop-color="#FF7700"/>
      <stop offset="33.3%" stop-color="#FFE500"/>
      <stop offset="50%"   stop-color="#00CC00"/>
      <stop offset="66.6%" stop-color="#00CCFF"/>
      <stop offset="83.3%" stop-color="#0044FF"/>
      <stop offset="100%"  stop-color="#8800FF"/>
    </linearGradient>
    <linearGradient id="spectrumSpine512" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"    stop-color="#FF0000"/>
      <stop offset="25%"   stop-color="#FFE500"/>
      <stop offset="50%"   stop-color="#00CC00"/>
      <stop offset="75%"   stop-color="#0044FF"/>
      <stop offset="100%"  stop-color="#8800FF"/>
    </linearGradient>
    <linearGradient id="pageLeft512" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8ddd0"/>
      <stop offset="100%" stop-color="#f9f4ec"/>
    </linearGradient>
    <linearGradient id="pageRight512" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f9f4ec"/>
      <stop offset="100%" stop-color="#e8ddd0"/>
    </linearGradient>
    <linearGradient id="spectrumBar512" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"    stop-color="#FF0000"/>
      <stop offset="20%"   stop-color="#FF7700"/>
      <stop offset="40%"   stop-color="#FFE500"/>
      <stop offset="60%"   stop-color="#00CC00"/>
      <stop offset="80%"   stop-color="#0044FF"/>
      <stop offset="100%"  stop-color="#8800FF"/>
    </linearGradient>
  </defs>

  <!-- Outer book cover – Spektralgradient -->
  <rect x="36" y="72" width="440" height="368" rx="18" ry="18"
        fill="url(#spectrumCover512)" filter="url(#shadow512)"/>

  <!-- Left page -->
  <rect x="60" y="90" width="192" height="332" rx="4" ry="4"
        fill="url(#pageLeft512)"/>

  <!-- Right page -->
  <rect x="260" y="90" width="192" height="332" rx="4" ry="4"
        fill="url(#pageRight512)"/>

  <!-- Spine -->
  <rect x="240" y="72" width="32" height="368"
        fill="url(#spectrumSpine512)"/>
  <rect x="255" y="72" width="2" height="368"
        fill="#ffffff" opacity="0.30"/>

  <!-- Text lines – left page -->
  <g opacity="0.55">
    <rect x="82"  y="130" width="148" height="8" rx="4" fill="#FF2200"/>
    <rect x="82"  y="152" width="130" height="8" rx="4" fill="#FF7700"/>
    <rect x="82"  y="174" width="148" height="8" rx="4" fill="#FFE500"/>
    <rect x="82"  y="196" width="110" height="8" rx="4" fill="#00BB00"/>
    <rect x="82"  y="218" width="148" height="8" rx="4" fill="#00AAEE"/>
    <rect x="82"  y="240" width="138" height="8" rx="4" fill="#0044FF"/>
    <rect x="82"  y="270" width="148" height="8" rx="4" fill="#8800FF"/>
    <rect x="82"  y="292" width="120" height="8" rx="4" fill="#FF2200"/>
    <rect x="82"  y="314" width="148" height="8" rx="4" fill="#FF7700"/>
    <rect x="82"  y="336" width="100" height="8" rx="4" fill="#FFE500"/>
    <rect x="82"  y="358" width="148" height="8" rx="4" fill="#00BB00"/>
  </g>

  <!-- Text lines – right page -->
  <g opacity="0.55">
    <rect x="282" y="130" width="148" height="8" rx="4" fill="#00AAEE"/>
    <rect x="282" y="152" width="120" height="8" rx="4" fill="#0044FF"/>
    <rect x="282" y="174" width="148" height="8" rx="4" fill="#8800FF"/>
    <rect x="282" y="196" width="138" height="8" rx="4" fill="#FF2200"/>
    <rect x="282" y="218" width="148" height="8" rx="4" fill="#FF7700"/>
    <rect x="282" y="240" width="108" height="8" rx="4" fill="#FFE500"/>
    <rect x="282" y="270" width="148" height="8" rx="4" fill="#00BB00"/>
    <rect x="282" y="292" width="130" height="8" rx="4" fill="#00AAEE"/>
    <rect x="282" y="314" width="148" height="8" rx="4" fill="#0044FF"/>
    <rect x="282" y="336" width="115" height="8" rx="4" fill="#8800FF"/>
    <rect x="282" y="358" width="148" height="8" rx="4" fill="#FF2200"/>
  </g>

  <!-- Section header accent bars -->
  <rect x="82"  y="108" width="148" height="12" rx="6"
        fill="url(#spectrumBar512)" opacity="0.90"/>
  <rect x="282" y="108" width="148" height="12" rx="6"
        fill="url(#spectrumBar512)" opacity="0.90"/>

  <!-- Page curl hint -->
  <path d="M452 422 Q452 440 434 440 L452 440 Z"
        fill="#d8d0f0" opacity="0.55"/>
</svg>
